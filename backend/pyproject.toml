[project]
name = "bidachat-backend"
version = "0.1.0"
description = "BIDACHAT REST API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-text-splitters>=0.3,<2",
    "pgvector>=0.3,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires the local PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
