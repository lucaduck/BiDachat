upstream bidachat_frontend {
    zone bidachat_frontend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server frontend:3000 resolve;
}

upstream bidachat_backend {
    zone bidachat_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8000 resolve;
}

map $http_x_forwarded_proto $bidachat_scheme {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 25m;

    location /api/v1/ {
        proxy_pass http://bidachat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $bidachat_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    location / {
        proxy_pass http://bidachat_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $bidachat_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
