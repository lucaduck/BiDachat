name: Publish and deploy production

on:
  pull_request:
    branches: [production]
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.value }}
    steps:
      - name: Require approval of the merged revision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --jq '.[] | select(.state == "APPROVED") | .commit_id' \
            | grep -Fx "$PR_HEAD_SHA" > /dev/null

      - name: Select the merged revision
        id: revision
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          test -n "$MERGE_SHA"
          printf 'value=%s\n' "$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the verified revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.revision.outputs.value }}
          fetch-depth: 0

      - name: Confirm production still points to this revision
        env:
          RELEASE_SHA: ${{ steps.revision.outputs.value }}
        run: |
          git fetch origin production
          test "$(git rev-parse origin/production)" = "$RELEASE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.0.0

      - name: Validate production Compose configuration
        env:
          POSTGRES_DB: bidachat
          POSTGRES_USER: bidachat
          POSTGRES_PASSWORD: ci_placeholder
          EMBEDDING_DIMENSIONS: "768"
          IMAGE_TAG: ${{ steps.revision.outputs.value }}
        run: |
          docker compose -f docker-compose.production.yml config --quiet
          docker compose -f docker-compose.production.yml -f docker-compose.gpu.yml config --quiet

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: |
            ghcr.io/lucaduck/bidachat-backend:${{ steps.revision.outputs.value }}
            ghcr.io/lucaduck/bidachat-backend:production
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publish frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/lucaduck/bidachat-frontend:${{ steps.revision.outputs.value }}
            ghcr.io/lucaduck/bidachat-frontend:production
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.value }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy on the production server
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      RELEASE_SHA: ${{ needs.publish.outputs.revision }}
    steps:
      - name: Validate deployment configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure the trusted SSH host
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Update the server and verify its health
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && git fetch origin production && git checkout production && git pull --ff-only origin production && test \"\$(git rev-parse HEAD)\" = '$RELEASE_SHA' && IMAGE_TAG='$RELEASE_SHA' sh docker/deploy-production.sh"
