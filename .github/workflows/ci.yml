name: Continuous Integration

on:
  pull_request:
    branches: [develop, production]
  push:
    branches: [develop, production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-24.04
    services:
      database:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: bidachat_test
          POSTGRES_USER: bidachat
          POSTGRES_PASSWORD: bidachat_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidachat -d bidachat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://bidachat:bidachat_test_password@127.0.0.1:5432/bidachat_test
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: embeddinggemma:300m
      EMBEDDING_DIMENSIONS: "768"
      DOCUMENT_STORAGE_PATH: /tmp/bidachat-documents
      ADMIN_EMAIL: admin@bidachat.test
      ADMIN_PASSWORD: bidachat_test_password
    steps:
      - name: Check out the revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups

      - name: Initialize the test schema
        env:
          PGPASSWORD: bidachat_test_password
        run: |
          psql --host 127.0.0.1 --username bidachat --dbname bidachat_test --set ON_ERROR_STOP=1 --set embedding_dimensions=768 --file database/migrations/001_initial_schema.up.sql
          psql --host 127.0.0.1 --username bidachat --dbname bidachat_test --set ON_ERROR_STOP=1 --file database/migrations/002_login_attempts.up.sql
          psql --host 127.0.0.1 --username bidachat --dbname bidachat_test --set ON_ERROR_STOP=1 --file database/migrations/003_widget_settings.up.sql
          psql --host 127.0.0.1 --username bidachat --dbname bidachat_test --set ON_ERROR_STOP=1 --file database/migrations/004_chatbot_document_associations.up.sql

      - name: Check backend style
        working-directory: backend
        run: |
          uv run --locked ruff check app tests
          uv run --locked ruff format --check app tests

      - name: Run backend tests
        working-directory: backend
        run: uv run --locked pytest

  frontend:
    name: Frontend quality and tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check frontend quality
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run build

  widget:
    name: Widget build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Build the embeddable widget
        working-directory: widget
        run: |
          npm run build
          node --check dist/bidachat-widget.js

      - name: Retain the generated widget
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bidachat-widget-${{ github.sha }}
          path: widget/dist/bidachat-widget.js
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Container builds
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.0.0

      - name: Build backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: bidachat-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: bidachat-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
