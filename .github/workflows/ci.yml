name: Continuous Integration

on:
  pull_request:
    branches: [develop, production]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      database:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: bidachat_test
          POSTGRES_USER: bidachat
          POSTGRES_PASSWORD: bidachat_test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bidachat -d bidachat_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://bidachat:bidachat_test_password@127.0.0.1:5432/bidachat_test
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: embeddinggemma:300m
      EMBEDDING_DIMENSIONS: "768"
      DOCUMENT_STORAGE_PATH: /tmp/bidachat-documents
      ADMIN_EMAIL: admin@bidachat.test
      ADMIN_PASSWORD: bidachat_test_password
      PGPASSWORD: bidachat_test_password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --all-groups
        working-directory: backend
      - name: Initialize test database
        run: |
          for migration in database/migrations/*.up.sql; do
            psql --host 127.0.0.1 --username bidachat --dbname bidachat_test \
              --set ON_ERROR_STOP=1 --set embedding_dimensions=768 --file "$migration"
          done
      - name: Check and test backend
        working-directory: backend
        run: |
          uv run --locked ruff check app tests
          uv run --locked ruff format --check app tests
          uv run --locked pytest

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Check and build frontend
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Build widget
        working-directory: widget
        run: |
          npm run build
          node --check dist/bidachat-widget.js
